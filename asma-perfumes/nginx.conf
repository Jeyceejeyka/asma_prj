server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # React Router — unknown paths fall back to index.html instead of 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # `backend` is the Docker Compose service name. `localhost` would refer to
    # this Nginx container and cannot reach Django in the separate container.
    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
